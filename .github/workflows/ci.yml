name: ci

on:
  push:
  pull_request:

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install decap
        run: python -m pip install -e ".[dev]"
      - name: Confirm decap is on PATH
        run: python -c "import shutil; assert shutil.which('decap'), 'decap missing from PATH'"
      - name: pytest
        run: python -m pytest -q
      - name: Hook end to end
        run: python scripts/e2e_hook.py
        env:
          DECAP_E2E_OUT: e2e-artifacts
      - name: Upload Windows decision images
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-decision-pngs
          path: e2e-artifacts/*.png

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test libraries
        run: |
          sudo apt-get update
          pkgs="xvfb libnss3 libgbm1 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2"
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then pkgs="$pkgs libgtk-3-0t64"; else pkgs="$pkgs libgtk-3-0"; fi
          if apt-cache show libasound2t64 >/dev/null 2>&1; then pkgs="$pkgs libasound2t64"; else pkgs="$pkgs libasound2"; fi
          sudo apt-get install -y $pkgs
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Extension tests
        working-directory: extension
        run: xvfb-run -a npm test
      - name: Screenshot the why panel
        working-directory: extension
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb || true
            sudo apt-get install -y /tmp/chrome.deb || true
          fi
          node scripts/shot-panel.js
      - name: Package the vsix
        working-directory: extension
        run: npm run package
      - name: Upload the vsix
        uses: actions/upload-artifact@v4
        with:
          name: decap-vsix
          path: extension/*.vsix
      - name: Upload the why panel screenshot
        uses: actions/upload-artifact@v4
        with:
          name: why-panel-dark
          path: extension/media/why-panel-dark.png

  extension-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hide Python from the extension
        shell: pwsh
        run: |
          $trap = Join-Path $env:RUNNER_TEMP "decap-no-python"
          New-Item -ItemType Directory -Force $trap | Out-Null
          $marker = Join-Path $env:RUNNER_TEMP "python-invoked.txt"
          if (Test-Path $marker) { Remove-Item $marker }
          $body = "Set-Content -Path '$marker' -Value invoked`r`nexit 1`r`n"
          foreach ($name in @("python", "python3", "py")) {
            Set-Content -Path (Join-Path $trap "$name.cmd") -Value $body -Encoding ascii
          }
          $clean = ($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ "python.exe")) -and -not (Test-Path (Join-Path $_ "python3.exe")) -and -not (Test-Path (Join-Path $_ "py.exe"))
          }) -join ';'
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "PATH=$trap;$clean"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "DECAP_PYTHON_TRAP=$marker"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM -Value "DECAP_E2E_OUT=$env:GITHUB_WORKSPACE\extension\e2e-artifacts"
      - name: Confirm Python on PATH is the trap
        shell: pwsh
        run: |
          $cmd = Get-Command python
          if ($cmd.Source -notlike "*decap-no-python*") { throw "python resolved to $($cmd.Source)" }
          if (Test-Path $env:DECAP_PYTHON_TRAP) { throw "trap file already exists" }
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Extension tests
        working-directory: extension
        run: npm test
      - name: Upload extension images
        uses: actions/upload-artifact@v4
        with:
          name: windows-extension-pngs
          path: extension/e2e-artifacts/*.png
